# Configuration file for DRO-CVRP

name: "DRO_CVRP_Model"

# Device configuration
use_cuda: false
cuda_device_num: 0

# VRPLib configuration
vrplib_set: "X"  # "X" or "XXL"
repeat_times: 1

# Model checkpoint
load_checkpoint: "weights/ELG.pt"  # Update this path

# Model parameters
model_params:
  embedding_dim: 128
  encoder_layer_num: 6
  head_num: 8 
  qkv_dim: 16
  ff_hidden_dim: 512
  logit_clipping: 50  # Changed from 10.0 to match original
  
  # Local attention parameters - matching original configuration
  local_att_hidden_dim: 32  # Changed from 128 to match original
  local_att_head_num: 4     # Changed from 8 to match original
  local_att_qkv_dim: 8      # Changed from 16 to match original
  local_size: [40]          # Changed from [20, 20, 20] to match original
  
  # Feature flags - matching original configuration
  demand: true
  euclidean: false          # Changed from true to match original
  positional: true
  distance_penalty: true
  xi: -1                    # Changed from 0.1 to match original
  
  # Ensemble parameters - CRITICAL: Must match checkpoint structure
  ensemble: true            # Changed from false to true to match checkpoint
  ensemble_size: 1          # Changed from 3 to 1 to match original
  
  # DRO specific parameters
  dro_penalty_in_decoder: true  # Whether to include DRO penalty in decoder
  
  # Additional parameters needed for DRO model
  N: 50  # Number of historical samples for uncertainty embedding

# Algorithm parameters  
params:
  aug_factor: 8  # Data augmentation factor

# DRO specific parameters
dro_params:
  # Wasserstein ball radius
  epsilon: 0.1
  
  # Big-M penalty for unvisited nodes
  M: 1000000
  
  # Number of historical samples
  N: 50
  
  # Regularization parameter for dual variables
  lambda_reg: 0.01
  
  # Uncertainty parameters
  uncertainty_std: 0.15  # Standard deviation for demand uncertainty (15%)
  
  # Sample generation strategy: 'gaussian', 'uniform', 'historical'
  sample_strategy: 'historical'
  
  # Dual optimization parameters
  dual_max_iter: 100
  dual_lr: 0.01
  
  # Robustness evaluation
  num_eval_scenarios: 20  # Number of scenarios for robustness evaluation
  
  # Penalty weights
  feasibility_penalty: 10.0  # Penalty for infeasible solutions
  robustness_weight: 0.1  # Weight for robustness in objective
  
  # Convergence criteria
  dual_tolerance: 1e-4
  max_constraint_violation: 1e-3

# Training parameters (if training from scratch)
training_params:
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 1e-6
  max_epochs: 100
  
  # DRO training specific
  dro_start_epoch: 20  # Start DRO training after this epoch
  uncertainty_curriculum: true  # Gradually increase uncertainty
  initial_uncertainty_std: 0.05
  final_uncertainty_std: 0.15
  
# Evaluation parameters
eval_params:
  eval_batch_size: 1
  eval_episodes: 1
  save_solutions: true
  save_robustness_analysis: true
  
# Output parameters
output:
  save_results: true
  result_dir: "test_results"
  save_plots: true
  verbose: true